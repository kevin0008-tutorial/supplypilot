[project]
name = "supplypilot"
version = "0.1.0"
description = "零售补货决策 Copilot（直通硅谷 AI 工程项目课）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
forecast = [
    "chronos-forecasting>=2.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx2>=2.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
